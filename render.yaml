services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - type: web
    name: railpredict-api
    runtime: python
    # No rootDir — run from repo root so backend.xxx imports resolve correctly
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railpredict-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  # ── PostgreSQL managed by Render ─────────────────────────────────────────────
  - name: railpredict-db
    databaseName: railpredict_db
    user: railpredict
    plan: free
