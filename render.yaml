services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - type: web
    name: railpredict-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railpredict-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Add repo root to Python path so "from backend.xxx import" still resolves
      - key: PYTHONPATH
        value: /opt/render/project/src

databases:
  # ── PostgreSQL managed by Render ─────────────────────────────────────────────
  - name: railpredict-db
    databaseName: railpredict_db
    user: railpredict
    plan: free
