services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - type: web
    name: railpredict-api
    runtime: python
    # NO rootDir — run from repo root so all "from backend.xxx import" work
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    preDeployCommand: >-
      python -m alembic -c backend/alembic.ini upgrade head &&
      python backend/seed_trains.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railpredict-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  # ── PostgreSQL managed by Render ─────────────────────────────────────────────
  - name: railpredict-db
    databaseName: railpredict_db
    user: railpredict
    plan: free
